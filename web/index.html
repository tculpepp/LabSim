<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#3060d0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LabSim">
  <title>LabSim</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    html, body { margin: 0; height: 100%; background: #1e2a3a; overflow: hidden; touch-action: none; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center;
               color: #fff; font: 600 24px system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="loading">Loading the lab…</div>
  <script src="wasm_exec.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch((e) => console.warn("SW failed", e));
    }
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("labsim.wasm"), go.importObject)
      .then((r) => {
        document.getElementById("loading").remove();
        go.run(r.instance);
      })
      .catch((e) => {
        document.getElementById("loading").textContent = "Oops! The lab could not load.";
        console.error(e);
      });
  </script>
</body>
</html>
